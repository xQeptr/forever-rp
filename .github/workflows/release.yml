name: Attach releases
on:
  release:
    types: [published]

permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Install Lua
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4
      - name: Validate release source
        run: |
          find ForeverRP -name '*.lua' -print0 | xargs -0 -n1 luac5.4 -p
          lua5.4 tests/mock_ui.lua
          lua5.4 tests/mock_events.lua
          lua5.4 tests/mock_scanner.lua
          lua5.4 tests/mock_quest_items.lua
          lua5.4 tests/mock_quest_ui.lua
          lua5.4 tests/mock_library.lua
          lua5.4 tests/mock_text_quality.lua
          lua5.4 tests/mock_identity.lua
          lua5.4 tests/mock_identity_speech.lua
          lua5.4 tests/mock_manual_chat.lua
          lua5.4 tests/mock_group_chat.lua
          lua5.4 tests/mock_group_speech.lua
          lua5.4 tests/mock_group_ui.lua
          lua5.4 tests/mock_item_source.lua
          lua5.4 tests/mock_localization.lua
          lua5.4 tests/mock_localization_ui.lua
          lua5.4 tests/mock_german_speech.lua
      - name: Build Retail and Forever packages
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
        run: python3 tools/package.py --version "$RELEASE_VERSION"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
