name: Attach releases
on:
  release:
    types: [published]

permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Build Retail and Forever packages
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
        run: python3 tools/package.py --version "$RELEASE_VERSION"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
